<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ice Cream Stock Pro - View Inventory</title>
    
    <!-- Theme Color for Mobile Browser -->
    <meta name="theme-color" content="#a855f7">
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS Console Warning Suppressor -->
    <script>
        const originalWarn = console.warn;
        console.warn = function(msg) {
            if (typeof msg === 'string' && msg.includes('cdn.tailwindcss.com should not be used in production')) return;
            originalWarn.apply(console, arguments);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            purple: '#f3e8ff', pink: '#fce7f3', 
                            blue: '#e0f2fe', dark: '#1f2937'
                        }
                    },
                    boxShadow: {
                        'ios': '0 8px 30px rgba(0,0,0,0.04)',
                        'ios-lg': '0 20px 40px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            overflow-x: hidden;
            user-select: none;
        }
        
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <!-- ========================================== -->
    <!-- TOP APP BAR                                -->
    <!-- ========================================== -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm py-4 px-5 flex justify-between items-center border-b border-gray-100">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-100 hover:text-purple-600 transition active:scale-90">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div>
                <h1 class="text-lg font-bold text-gray-800 leading-tight">Inventory Stock</h1>
                <p class="text-[10px] text-gray-500 font-medium uppercase tracking-wider">All Items</p>
            </div>
        </div>
        <button onclick="window.location.href='add.html'" class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center hover:bg-purple-200 transition active:scale-90">
            <i class="fa-solid fa-plus"></i>
        </button>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT AREA                          -->
    <!-- ========================================== -->
    <main class="flex-1 w-full max-w-lg mx-auto overflow-y-auto px-4 pt-5 pb-24 animate-fade-up">
        
        <!-- Search Bar -->
        <div class="relative mb-5">
            <input type="text" id="search-input" onkeyup="filterStock()" placeholder="Search stock items by name..." class="w-full bg-white border border-gray-200 text-sm rounded-2xl pl-12 pr-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-purple-400 shadow-sm transition-all">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
        </div>

        <!-- Category Filter Tabs -->
        <div class="flex space-x-3 overflow-x-auto no-scrollbar pb-2 mb-6" id="category-tabs-container">
            <!-- Tabs injected dynamically -->
        </div>

        <!-- Stock Items Grid -->
        <div class="grid grid-cols-2 gap-4" id="stock-grid">
            <!-- Items injected dynamically -->
        </div>
        
        <!-- Empty State (Hidden by default) -->
        <div id="empty-state" class="hidden text-center py-16">
            <div class="w-20 h-20 bg-purple-50 text-purple-400 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-box-open text-3xl"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-700">No Stock Items Found</h3>
            <p class="text-xs text-gray-500 mt-1 mb-6">You haven't added any products to this category yet.</p>
            <button onclick="window.location.href='add.html?type=item'" class="bg-purple-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-purple-700 transition">Add New Item</button>
        </div>

    </main>

    <!-- ========================================== -->
    <!-- ITEM DETAIL MODAL                          -->
    <!-- ========================================== -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity duration-300" onclick="closeDetailModal()"></div>
    
    <div id="detail-modal" class="fixed bottom-0 left-0 w-full bg-white rounded-t-3xl z-[70] transform translate-y-full transition-transform duration-300 max-h-[85vh] overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-gray-800">Item Details</h3>
            <button onclick="closeDetailModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="modal-content">
            <!-- Dynamic Details -->
        </div>
    </div>

    <!-- ========================================== -->
    <!-- BOTTOM NAVIGATION BAR                      -->
    <!-- ========================================== -->
    <nav class="fixed bottom-0 left-0 w-full glass-nav z-50 pb-safe pb-2">
        <div class="flex justify-around items-center h-16 px-2 max-w-lg mx-auto">
            <button onclick="window.location.href='index.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-house text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Home</span>
            </button>
            <button onclick="window.location.href='view.html'" class="flex flex-col items-center w-full text-purple-600 transition active:scale-90">
                <i class="fa-solid fa-layer-group text-xl mb-1"></i>
                <span class="text-[10px] font-bold">View</span>
            </button>
            <button onclick="window.location.href='add.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90 relative">
                <div class="absolute -top-6 w-12 h-12 bg-gray-900 text-white rounded-full flex items-center justify-center shadow-lg border-4 border-white transition-transform hover:scale-105">
                    <i class="fa-solid fa-plus text-xl"></i>
                </div>
                <span class="text-[10px] font-semibold mt-7">Add</span>
            </button>
            <button onclick="window.location.href='setting.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-gear text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Setting</span>
            </button>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC                           -->
    <!-- ========================================== -->
    <script>
        let categories = [];
        let items = [];
        let activeCategoryId = 'All';

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderTabs();
            renderGrid();
        });

        function loadData() {
            try {
                categories = JSON.parse(localStorage.getItem('ic_categories')) || [];
                items = JSON.parse(localStorage.getItem('ic_items')) || [];
            } catch (e) {
                categories = [];
                items = [];
            }
        }

        // 1. Render Filter Tabs
        function renderTabs() {
            const tabsContainer = document.getElementById('category-tabs-container');
            
            let html = `<button onclick="setFilter('All')" class="px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm transition ${activeCategoryId === 'All' ? 'bg-gray-900 text-white' : 'bg-white text-gray-600 border border-gray-200'}">All Stock</button>`;
            
            categories.forEach(cat => {
                const isActive = activeCategoryId === cat.id;
                html += `<button onclick="setFilter('${cat.id}')" class="px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm transition ${isActive ? 'bg-purple-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}">${cat.name}</button>`;
            });
            
            tabsContainer.innerHTML = html;
        }

        function setFilter(catId) {
            activeCategoryId = catId;
            renderTabs();
            renderGrid();
        }

        // 2. Render Stock Grid
        function renderGrid() {
            const grid = document.getElementById('stock-grid');
            const emptyState = document.getElementById('empty-state');
            
            let filtered = activeCategoryId === 'All' ? items : items.filter(i => i.categoryId === activeCategoryId);
            
            // Search query filter
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (query) {
                filtered = filtered.filter(i => i.name.toLowerCase().includes(query));
            }

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            
            grid.innerHTML = filtered.map(item => {
                const cat = categories.find(c => c.id === item.categoryId);
                const catName = cat ? cat.name : 'General';
                const isLow = (parseInt(item.quantity) || 0) < 50;
                
                const stockBadge = isLow 
                    ? `<span class="text-red-500 font-semibold flex items-center gap-1"><i class="fa-solid fa-triangle-exclamation"></i> Low (${item.quantity})</span>` 
                    : `<span class="text-green-600 font-semibold flex items-center gap-1"><i class="fa-solid fa-check"></i> Stock (${item.quantity})</span>`;

                return `
                <div onclick="openDetail('${item.id}')" class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm flex flex-col active:scale-95 transition cursor-pointer relative overflow-hidden">
                    <img src="${item.image || 'https://via.placeholder.com/150?text=No+Image'}" alt="${item.name}" class="w-full h-28 object-cover rounded-xl mb-2 bg-gray-50">
                    <p class="text-[9px] text-purple-600 font-bold uppercase tracking-wider truncate">${catName}</p>
                    <h4 class="font-bold text-gray-800 text-sm leading-tight mb-2 truncate">${item.name}</h4>
                    <div class="mt-auto pt-2 border-t border-gray-50 flex justify-between items-end">
                        <div>
                            <p class="text-[10px] text-gray-400">Price</p>
                            <p class="text-xs font-extrabold text-gray-900">Rs ${item.price}</p>
                        </div>
                        <div class="text-[10px] text-right">
                            ${stockBadge}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function filterStock() {
            renderGrid();
        }

        // 3. Item Detail Modal Logic
        function openDetail(itemId) {
            loadData();
            const item = items.find(i => i.id === itemId);
            if(!item) return;

            const cat = categories.find(c => c.id === item.categoryId);
            const catName = cat ? cat.name : 'General';

            document.getElementById('modal-content').innerHTML = `
                <img src="${item.image || 'https://via.placeholder.com/300?text=No+Image'}" class="w-full h-48 object-cover rounded-2xl mb-4 shadow-sm border border-gray-100">
                <span class="inline-block bg-purple-50 text-purple-700 text-xs font-bold px-3 py-1 rounded-full mb-2">${catName}</span>
                <h2 class="text-2xl font-extrabold text-gray-900 mb-2">${item.name}</h2>
                
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Quantity Available</p>
                        <p class="text-xl font-extrabold text-purple-600">${item.quantity}</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Unit Price</p>
                        <p class="text-xl font-extrabold text-gray-800">Rs ${item.price}</p>
                    </div>
                </div>

                <div class="mb-6">
                    <p class="text-xs font-bold text-gray-400 uppercase mb-1">Description</p>
                    <p class="text-sm text-gray-600 bg-gray-50 p-3 rounded-xl border border-gray-100 leading-relaxed">${item.desc || 'No description added for this item.'}</p>
                </div>

                <div class="flex gap-3">
                    <button onclick="deleteItem('${item.id}')" class="flex-1 bg-red-50 text-red-600 font-bold py-3.5 rounded-xl border border-red-100 active:bg-red-100 transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-trash-can"></i> Delete Item
                    </button>
                    <button onclick="closeDetailModal()" class="flex-1 bg-gray-900 text-white font-bold py-3.5 rounded-xl active:bg-black transition text-sm">
                        Close
                    </button>
                </div>
            `;

            const backdrop = document.getElementById('modal-backdrop');
            const modal = document.getElementById('detail-modal');

            backdrop.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                backdrop.classList.add('opacity-100');
                modal.classList.remove('translate-y-full');
            }, 10);
        }

        function closeDetailModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const modal = document.getElementById('detail-modal');

            modal.classList.add('translate-y-full');
            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');
            setTimeout(() => backdrop.classList.add('hidden'), 300);
        }

        function deleteItem(itemId) {
            if(confirm("Are you sure you want to delete this stock item?")) {
                items = items.filter(i => i.id !== itemId);
                localStorage.setItem('ic_items', JSON.stringify(items));
                closeDetailModal();
                renderGrid();
            }
        }
    </script>
</body>
</html>
