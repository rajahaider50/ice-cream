<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ice Cream & Slush - Stock Management</title>
    
    <!-- PWA Link -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Mobile App Properties -->
    <meta name="theme-color" content="#a855f7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind Console Warning Suppressor -->
    <script>
        const originalWarn = console.warn;
        console.warn = function(msg) {
            if (typeof msg === 'string' && msg.includes('cdn.tailwindcss.com should not be used in production')) return;
            originalWarn.apply(console, arguments);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            purple: '#f3e8ff', pink: '#fce7f3', 
                            blue: '#e0f2fe', dark: '#1f2937'
                        }
                    },
                    boxShadow: {
                        'ios': '0 8px 30px rgba(0,0,0,0.04)',
                        'ios-lg': '0 20px 40px rgba(0,0,0,0.08)',
                        'bank-minus': '0 4px 12px rgba(239, 68, 68, 0.25)',
                        'bank-plus': '0 4px 12px rgba(16, 185, 129, 0.25)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            overflow-x: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.4s ease-out forwards;
        }

        /* Banking Style Button Transitions */
        .btn-bank {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-bank:active {
            transform: scale(0.88);
        }

        /* Dark Theme Support */
        body.dark-mode {
            background-color: #0f172a;
            color: #f8fafc;
        }
        body.dark-mode .bg-white {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }
        body.dark-mode .text-gray-800, body.dark-mode .text-gray-900, body.dark-mode .text-gray-700 {
            color: #f1f5f9 !important;
        }
        body.dark-mode .text-gray-500, body.dark-mode .text-gray-400 {
            color: #94a3b8 !important;
        }
        body.dark-mode .bg-gray-50, body.dark-mode .bg-gray-100 {
            background-color: #334155 !important;
            color: #f8fafc !important;
        }
        body.dark-mode .glass-nav {
            background: rgba(30, 41, 59, 0.92) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <!-- ========================================== -->
    <!-- TOP APP BAR                                -->
    <!-- ========================================== -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm py-4 px-4 flex justify-between items-center border-b border-gray-100 w-full">
        <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-100 hover:text-purple-600 transition active:scale-90 flex-shrink-0">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </button>
            <div class="min-w-0 flex-1">
                <h1 class="text-base font-bold text-gray-800 leading-tight truncate">Stock Management</h1>
                <p class="text-[10px] text-purple-600 font-bold uppercase tracking-wider truncate">Banking Style Quick POS</p>
            </div>
        </div>
        <button onclick="window.location.href='add.html'" class="w-9 h-9 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center hover:bg-purple-200 transition active:scale-90 shadow-sm flex-shrink-0 ml-2">
            <i class="fa-solid fa-plus text-xs"></i>
        </button>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT AREA                          -->
    <!-- ========================================== -->
    <main class="flex-1 w-full max-w-lg mx-auto overflow-y-auto px-3.5 pt-3.5 pb-24 animate-fade-up">
        
        <!-- Search Bar -->
        <div class="relative mb-3.5 w-full">
            <input type="text" id="search-input" onkeyup="filterStock()" placeholder="Search Cones, Cups, Slush, Flavors..." class="w-full bg-white border border-gray-200 text-xs rounded-2xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-400 shadow-sm transition-all">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-xs"></i>
        </div>

        <!-- Category Filter Tabs -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-2 mb-3.5 w-full" id="category-tabs-container">
            <!-- Injected via JS -->
        </div>

        <!-- Stock Items List (Strict Mobile Fit - No Horizontal Overflow) -->
        <div class="space-y-2.5 w-full" id="stock-list-container">
            <!-- Injected via JS -->
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12 px-4">
            <div class="w-16 h-16 bg-purple-50 text-purple-400 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-box-open text-2xl"></i>
            </div>
            <h3 class="text-sm font-bold text-gray-700">No Items Found</h3>
            <p class="text-xs text-gray-400 mt-1 mb-5">Add stock or change your search filter.</p>
            <button onclick="window.location.href='add.html'" class="bg-purple-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow-md hover:bg-purple-700 transition">
                <i class="fa-solid fa-plus mr-1"></i> Add Stock Item
            </button>
        </div>

    </main>

    <!-- ========================================== -->
    <!-- ITEM DETAIL & STOCK ADJUSTMENT MODAL       -->
    <!-- ========================================== -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity duration-300" onclick="closeDetailModal()"></div>
    
    <div id="detail-modal" class="fixed bottom-0 left-0 w-full bg-white rounded-t-3xl z-[70] transform translate-y-full transition-transform duration-300 max-h-[88vh] overflow-y-auto p-4 shadow-2xl">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-bold text-gray-800">Quick Stock Adjustment</h3>
            <button onclick="closeDetailModal()" class="w-7 h-7 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-200"><i class="fa-solid fa-xmark text-xs"></i></button>
        </div>
        <div id="modal-content" class="w-full">
            <!-- Modal Body Injected Dynamically -->
        </div>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toast-box" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-[11px] font-semibold shadow-2xl z-[100] transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px] max-w-[90%] truncate">
        Notification
    </div>

    <!-- ========================================== -->
    <!-- BOTTOM NAVIGATION BAR                      -->
    <!-- ========================================== -->
    <nav class="fixed bottom-0 left-0 w-full glass-nav z-50 pb-safe pb-2">
        <div class="flex justify-around items-center h-16 px-2 max-w-lg mx-auto">
            <button onclick="window.location.href='index.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-house text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Home</span>
            </button>
            <!-- Active: View -->
            <button onclick="window.location.href='view.html'" class="flex flex-col items-center w-full text-purple-600 transition active:scale-90">
                <i class="fa-solid fa-layer-group text-xl mb-1"></i>
                <span class="text-[10px] font-bold">View</span>
            </button>
            <button onclick="window.location.href='add.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90 relative">
                <div class="absolute -top-6 w-12 h-12 bg-gray-900 text-white rounded-full flex items-center justify-center shadow-lg border-4 border-white transition-transform hover:scale-105">
                    <i class="fa-solid fa-plus text-xl"></i>
                </div>
                <span class="text-[10px] font-semibold mt-7">Add</span>
            </button>
            <button onclick="window.location.href='history.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">History</span>
            </button>
            <button onclick="window.location.href='setting.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-gear text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Setting</span>
            </button>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- JAVASCRIPT CORE LOGIC                      -->
    <!-- ========================================== -->
    <script>
        let categories = [];
        let items = [];
        let history = [];
        let activeCategoryId = 'All';

        document.addEventListener('DOMContentLoaded', () => {
            loadSavedTheme();
            loadData();
            renderCategoryTabs();
            renderStockList();
        });

        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('ic_theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        function loadData() {
            try {
                categories = JSON.parse(localStorage.getItem('ic_categories')) || [];
                items = JSON.parse(localStorage.getItem('ic_items')) || [];
                history = JSON.parse(localStorage.getItem('ic_history')) || [];
            } catch (e) {
                console.error("Local Storage Load Error:", e);
                categories = []; items = []; history = [];
            }
        }

        function saveData() {
            localStorage.setItem('ic_items', JSON.stringify(items));
            localStorage.setItem('ic_history', JSON.stringify(history));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-box');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 2200);
        }

        // 1. Render Filter Tabs
        function renderCategoryTabs() {
            const container = document.getElementById('category-tabs-container');
            
            let html = `
                <button onclick="setCategoryFilter('All')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition shadow-sm ${activeCategoryId === 'All' ? 'bg-gray-900 text-white' : 'bg-white text-gray-600 border border-gray-200'}">
                    All Categories
                </button>
            `;

            categories.forEach(cat => {
                const isActive = activeCategoryId === cat.id;
                html += `
                    <button onclick="setCategoryFilter('${cat.id}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition shadow-sm ${isActive ? 'bg-purple-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}">
                        ${cat.name}
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        function setCategoryFilter(catId) {
            activeCategoryId = catId;
            renderCategoryTabs();
            renderStockList();
        }

        // 2. Render Stock Items List with Banking-Style Control Buttons
        function renderStockList() {
            const listContainer = document.getElementById('stock-list-container');
            const emptyState = document.getElementById('empty-state');

            let filtered = activeCategoryId === 'All' ? items : items.filter(i => i.categoryId === activeCategoryId);

            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            if (searchQuery) {
                filtered = filtered.filter(i => i.name.toLowerCase().includes(searchQuery));
            }

            if (filtered.length === 0) {
                listContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            listContainer.innerHTML = filtered.map(item => {
                const cat = categories.find(c => c.id === item.categoryId);
                const catName = cat ? cat.name : 'General';
                const qty = parseInt(item.quantity) || 0;
                const isLow = qty <= 50;

                return `
                    <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm flex items-center justify-between gap-2.5 w-full active:scale-[0.99] transition">
                        
                        <!-- Left Product Details (Tap to Open Custom Popup) -->
                        <div class="flex items-center gap-2.5 min-w-0 flex-1 cursor-pointer" onclick="openDetailModal('${item.id}')">
                            <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold text-base flex-shrink-0 border border-purple-100">
                                <i class="fa-solid fa-ice-cream"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <span class="text-[9px] font-extrabold uppercase tracking-wider text-purple-600 block truncate">${catName}</span>
                                <h4 class="font-bold text-gray-800 text-xs truncate leading-tight">${item.name}</h4>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="text-[11px] font-extrabold text-emerald-600">Rs ${item.price || 0}</span>
                                    <span class="text-[9px] ${isLow ? 'bg-red-50 text-red-600 border-red-100' : 'bg-green-50 text-green-700 border-green-100'} font-bold px-1.5 py-0.2 rounded border">
                                        Qty: ${qty}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Right Banking Style Animated Plus/Minus Control Bar -->
                        <div class="flex items-center gap-1.5 bg-gray-50 p-1 rounded-2xl border border-gray-100 flex-shrink-0">
                            <!-- Minus Button (Banking Style Red Accent) -->
                            <button onclick="quickDeduct(event, '${item.id}')" class="btn-bank w-7 h-7 rounded-xl bg-gradient-to-br from-red-500 to-rose-600 text-white shadow-bank-minus flex items-center justify-center flex-shrink-0">
                                <i class="fa-solid fa-minus text-[10px]"></i>
                            </button>
                            
                            <span class="text-xs font-extrabold text-gray-900 w-6 text-center">${qty}</span>
                            
                            <!-- Plus Button (Banking Style Emerald Green Accent) -->
                            <button onclick="quickAdd(event, '${item.id}')" class="btn-bank w-7 h-7 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white shadow-bank-plus flex items-center justify-center flex-shrink-0">
                                <i class="fa-solid fa-plus text-[10px]"></i>
                            </button>
                        </div>

                    </div>
                `;
            }).join('');
        }

        function filterStock() {
            renderStockList();
        }

        // 3. Quick Actions (+1 / -1)
        function quickDeduct(e, itemId) {
            e.stopPropagation();
            adjustStock(itemId, -1, "Quick Usage");
        }

        function quickAdd(e, itemId) {
            e.stopPropagation();
            adjustStock(itemId, 1, "Quick Restock");
        }

        function adjustStock(itemId, delta, reason = "Adjustment") {
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            const currentQty = parseInt(item.quantity) || 0;
            const newQty = currentQty + delta;

            if (newQty < 0) {
                showToast("Stock quantity cannot be less than 0!");
                return;
            }

            item.quantity = newQty;

            // Date and Time calculation
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            // Create History Record
            const logEntry = {
                id: Date.now().toString(),
                itemId: item.id,
                itemName: item.name,
                type: delta < 0 ? 'deduct' : 'add',
                amount: Math.abs(delta),
                reason: reason,
                date: dateStr,
                time: timeStr
            };

            history.push(logEntry);
            saveData();
            renderStockList();
            showToast(`${item.name}: Stock updated (${newQty})`);
        }

        // 4. Custom Manual Input Popup Modal
        function openDetailModal(itemId) {
            loadData();
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            const cat = categories.find(c => c.id === item.categoryId);
            const catName = cat ? cat.name : 'General';

            document.getElementById('modal-content').innerHTML = `
                <div class="flex items-center gap-2.5 mb-3 bg-purple-50 p-3 rounded-2xl border border-purple-100 w-full">
                    <div class="w-10 h-10 rounded-xl bg-purple-600 text-white flex items-center justify-center font-bold text-lg flex-shrink-0">
                        <i class="fa-solid fa-ice-cream"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <span class="text-[9px] font-extrabold text-purple-700 uppercase tracking-wider block truncate">${catName}</span>
                        <h2 class="text-xs font-bold text-gray-900 leading-tight truncate">${item.name}</h2>
                        <p class="text-[11px] font-extrabold text-emerald-600 mt-0.5">Rs ${item.price || 0} / unit</p>
                    </div>
                </div>

                <!-- Current Stock Badge -->
                <div class="bg-gray-50 p-2.5 rounded-2xl border border-gray-100 text-center mb-3 w-full">
                    <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">Current Quantity</p>
                    <p class="text-2xl font-extrabold text-purple-600">${item.quantity} Units</p>
                </div>

                <!-- Manual Deduction Form -->
                <div class="space-y-2 mb-3 w-full">
                    <label class="block text-[10px] font-bold text-gray-600 uppercase tracking-wide">Enter Today's Used Quantity</label>
                    <div class="flex gap-2 w-full">
                        <input type="number" id="custom-qty-input" placeholder="e.g. 15" class="flex-1 min-w-0 bg-gray-50 border border-gray-200 p-2.5 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-purple-400">
                        <button onclick="applyCustomDeduct('${item.id}')" class="btn-bank bg-gradient-to-r from-red-500 to-rose-600 text-white px-4 rounded-xl text-xs font-bold shadow-bank-minus flex-shrink-0 flex items-center gap-1">
                            <i class="fa-solid fa-minus text-[10px]"></i> Deduct
                        </button>
                    </div>
                </div>

                <!-- Manual Restock Form -->
                <div class="space-y-2 mb-4 w-full">
                    <label class="block text-[10px] font-bold text-gray-600 uppercase tracking-wide">Enter Restock Quantity Added</label>
                    <div class="flex gap-2 w-full">
                        <input type="number" id="custom-add-input" placeholder="e.g. 50" class="flex-1 min-w-0 bg-gray-50 border border-gray-200 p-2.5 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-purple-400">
                        <button onclick="applyCustomAdd('${item.id}')" class="btn-bank bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-4 rounded-xl text-xs font-bold shadow-bank-plus flex-shrink-0 flex items-center gap-1">
                            <i class="fa-solid fa-plus text-[10px]"></i> Restock
                        </button>
                    </div>
                </div>

                <div class="flex gap-2 border-t border-gray-100 pt-3 w-full">
                    <button onclick="deleteItem('${item.id}')" class="flex-1 py-2.5 bg-red-50 text-red-600 font-bold text-xs rounded-xl border border-red-100 active:bg-red-100 transition truncate">
                        <i class="fa-solid fa-trash-can mr-1"></i> Delete
                    </button>
                    <button onclick="closeDetailModal()" class="flex-1 py-2.5 bg-gray-900 text-white font-bold text-xs rounded-xl active:bg-black transition truncate">
                        Close
                    </button>
                </div>
            `;

            const backdrop = document.getElementById('modal-backdrop');
            const modal = document.getElementById('detail-modal');

            backdrop.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                backdrop.classList.add('opacity-100');
                modal.classList.remove('translate-y-full');
            }, 10);
        }

        function closeDetailModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const modal = document.getElementById('detail-modal');

            modal.classList.add('translate-y-full');
            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');
            setTimeout(() => backdrop.classList.add('hidden'), 300);
        }

        function applyCustomDeduct(itemId) {
            const input = document.getElementById('custom-qty-input');
            const amount = parseInt(input.value) || 0;
            if (amount <= 0) {
                showToast("Please enter a valid deduction quantity!");
                return;
            }
            adjustStock(itemId, -amount, "Daily Usage");
            closeDetailModal();
        }

        function applyCustomAdd(itemId) {
            const input = document.getElementById('custom-add-input');
            const amount = parseInt(input.value) || 0;
            if (amount <= 0) {
                showToast("Please enter a valid restock quantity!");
                return;
            }
            adjustStock(itemId, amount, "Manual Restock");
            closeDetailModal();
        }

        function deleteItem(itemId) {
            if (confirm("Are you sure you want to delete this product?")) {
                items = items.filter(i => i.id !== itemId);
                saveData();
                closeDetailModal();
                renderStockList();
                showToast("Product deleted successfully.");
            }
        }
    </script>
</body>
</html>
