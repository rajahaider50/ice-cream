<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ice Cream & Slush - Usage History & Reports</title>
    
    <!-- PWA Link -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Mobile App Properties -->
    <meta name="theme-color" content="#a855f7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind Console Warning Suppressor -->
    <script>
        const originalWarn = console.warn;
        console.warn = function(msg) {
            if (typeof msg === 'string' && msg.includes('cdn.tailwindcss.com should not be used in production')) return;
            originalWarn.apply(console, arguments);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            purple: '#f3e8ff', pink: '#fce7f3', 
                            blue: '#e0f2fe', dark: '#1f2937'
                        }
                    },
                    boxShadow: {
                        'ios': '0 8px 30px rgba(0,0,0,0.04)',
                        'ios-lg': '0 20px 40px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            overflow-x: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.4s ease-out forwards;
        }

        /* Dark Theme Support */
        body.dark-mode {
            background-color: #0f172a;
            color: #f8fafc;
        }
        body.dark-mode .bg-white {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }
        body.dark-mode .text-gray-800, body.dark-mode .text-gray-900, body.dark-mode .text-gray-700 {
            color: #f1f5f9 !important;
        }
        body.dark-mode .text-gray-500, body.dark-mode .text-gray-400 {
            color: #94a3b8 !important;
        }
        body.dark-mode .bg-gray-50, body.dark-mode .bg-gray-100 {
            background-color: #334155 !important;
            color: #f8fafc !important;
        }
        body.dark-mode .glass-nav {
            background: rgba(30, 41, 59, 0.92) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <!-- ========================================== -->
    <!-- TOP APP BAR                                -->
    <!-- ========================================== -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm py-4 px-4 flex justify-between items-center border-b border-gray-100 w-full">
        <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-100 hover:text-purple-600 transition active:scale-90 flex-shrink-0">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </button>
            <div class="min-w-0 flex-1">
                <h1 class="text-base font-bold text-gray-800 leading-tight truncate">Usage Logs & Reports</h1>
                <p class="text-[10px] text-purple-600 font-bold uppercase tracking-wider truncate">Date Range & Export</p>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
            <button onclick="exportCleanReport()" class="bg-purple-600 text-white px-3 py-1.5 rounded-full text-xs font-bold shadow-sm hover:bg-purple-700 transition active:scale-95 flex items-center gap-1">
                <i class="fa-solid fa-file-export text-[10px]"></i> Report
            </button>
            <button onclick="clearHistoryLogs()" class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition active:scale-90 border border-red-100">
                <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT AREA                          -->
    <!-- ========================================== -->
    <main class="flex-1 w-full max-w-lg mx-auto overflow-y-auto px-3.5 pt-3.5 pb-24 animate-fade-up">
        
        <!-- Summary Dashboard Widgets -->
        <div class="grid grid-cols-2 gap-2.5 mb-3.5">
            <div class="bg-gradient-to-br from-pink-500 to-rose-600 p-3.5 rounded-2xl text-white shadow-sm">
                <p class="text-[9px] font-bold uppercase text-pink-100 tracking-wider">Used Today</p>
                <h2 class="text-xl font-extrabold mt-0.5" id="today-deducted-count">0 Units</h2>
            </div>
            <div class="bg-gradient-to-br from-purple-600 to-indigo-700 p-3.5 rounded-2xl text-white shadow-sm">
                <p class="text-[9px] font-bold uppercase text-purple-100 tracking-wider">Total Filtered Logs</p>
                <h2 class="text-xl font-extrabold mt-0.5" id="total-logs-count">0</h2>
            </div>
        </div>

        <!-- Date-to-Date Range Selector Widget -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 mb-3.5 space-y-2.5">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-days text-purple-600"></i> Date Range Filter
                </h3>
                <button onclick="resetDateFilter()" class="text-[10px] text-purple-600 font-bold hover:underline">Reset Dates</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[9px] font-bold text-gray-500 uppercase mb-1">Start Date (از)</label>
                    <input type="date" id="start-date-input" onchange="applyDateRangeFilter()" class="w-full bg-gray-50 border border-gray-200 p-2 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>
                <div>
                    <label class="block text-[9px] font-bold text-gray-500 uppercase mb-1">End Date (تک)</label>
                    <input type="date" id="end-date-input" onchange="applyDateRangeFilter()" class="w-full bg-gray-50 border border-gray-200 p-2 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>
            </div>
        </div>

        <!-- Type Filter Tabs (All / Used / Added) -->
        <div class="flex bg-gray-100 p-1 rounded-2xl mb-3.5 shadow-inner">
            <button onclick="setTypeFilter('all')" id="tab-all" class="flex-1 py-2 rounded-xl text-xs font-bold transition bg-white text-purple-700 shadow-sm">All Logs</button>
            <button onclick="setTypeFilter('deduct')" id="tab-deduct" class="flex-1 py-2 rounded-xl text-xs font-bold transition text-gray-500">Stock Used (-)</button>
            <button onclick="setTypeFilter('add')" id="tab-add" class="flex-1 py-2 rounded-xl text-xs font-bold transition text-gray-500">Restocks (+)</button>
        </div>

        <!-- History Items List Container -->
        <div class="space-y-2 w-full" id="history-list-container">
            <!-- Dynamic History Cards Injected Here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12 px-4">
            <div class="w-16 h-16 bg-gray-100 text-gray-300 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-clock-rotate-left text-2xl"></i>
            </div>
            <h3 class="text-sm font-bold text-gray-600">No Matching Records</h3>
            <p class="text-xs text-gray-400 mt-1">Adjust your date filter or add stock usage from View tab.</p>
        </div>

    </main>

    <!-- Custom Toast Notification -->
    <div id="toast-box" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-[11px] font-semibold shadow-2xl z-[100] transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px] max-w-[90%] truncate">
        Notification message
    </div>

    <!-- ========================================== -->
    <!-- BOTTOM NAVIGATION BAR                      -->
    <!-- ========================================== -->
    <nav class="fixed bottom-0 left-0 w-full glass-nav z-50 pb-safe pb-2">
        <div class="flex justify-around items-center h-16 px-2 max-w-lg mx-auto">
            <button onclick="window.location.href='index.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-house text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Home</span>
            </button>
            <button onclick="window.location.href='view.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-layer-group text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">View</span>
            </button>
            <button onclick="window.location.href='add.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90 relative">
                <div class="absolute -top-6 w-12 h-12 bg-gray-900 text-white rounded-full flex items-center justify-center shadow-lg border-4 border-white transition-transform hover:scale-105">
                    <i class="fa-solid fa-plus text-xl"></i>
                </div>
                <span class="text-[10px] font-semibold mt-7">Add</span>
            </button>
            <!-- Active: History -->
            <button onclick="window.location.href='history.html'" class="flex flex-col items-center w-full text-purple-600 transition active:scale-90">
                <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
                <span class="text-[10px] font-bold">History</span>
            </button>
            <button onclick="window.location.href='setting.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-gear text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Setting</span>
            </button>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- JAVASCRIPT CORE LOGIC                      -->
    <!-- ========================================== -->
    <script>
        let history = [];
        let activeTypeFilter = 'all';
        let startDateFilter = null;
        let endDateFilter = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadSavedTheme();
            loadHistoryData();
            renderHistoryLogs();
        });

        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('ic_theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        function loadHistoryData() {
            try {
                history = JSON.parse(localStorage.getItem('ic_history')) || [];
            } catch (e) {
                console.error("Local Storage Load Error:", e);
                history = [];
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-box');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 2200);
        }

        function setTypeFilter(type) {
            activeTypeFilter = type;

            const tabAll = document.getElementById('tab-all');
            const tabDeduct = document.getElementById('tab-deduct');
            const tabAdd = document.getElementById('tab-add');

            [tabAll, tabDeduct, tabAdd].forEach(btn => {
                btn.className = "flex-1 py-2 rounded-xl text-xs font-bold transition text-gray-500";
            });

            if (type === 'all') {
                tabAll.className = "flex-1 py-2 rounded-xl text-xs font-bold transition bg-white text-purple-700 shadow-sm";
            } else if (type === 'deduct') {
                tabDeduct.className = "flex-1 py-2 rounded-xl text-xs font-bold transition bg-white text-pink-600 shadow-sm";
            } else if (type === 'add') {
                tabAdd.className = "flex-1 py-2 rounded-xl text-xs font-bold transition bg-white text-emerald-700 shadow-sm";
            }

            renderHistoryLogs();
        }

        function applyDateRangeFilter() {
            const startVal = document.getElementById('start-date-input').value;
            const endVal = document.getElementById('end-date-input').value;

            startDateFilter = startVal ? new Date(startVal) : null;
            endDateFilter = endVal ? new Date(endVal) : null;

            if (startDateFilter && endDateFilter && startDateFilter > endDateFilter) {
                showToast("Start date cannot be after end date!");
                return;
            }

            renderHistoryLogs();
        }

        function resetDateFilter() {
            document.getElementById('start-date-input').value = '';
            document.getElementById('end-date-input').value = '';
            startDateFilter = null;
            endDateFilter = null;
            renderHistoryLogs();
            showToast("Date filter reset.");
        }

        function getFilteredLogs() {
            let filtered = [...history];

            // 1. Filter by Type
            if (activeTypeFilter === 'deduct') {
                filtered = filtered.filter(log => log.type === 'deduct');
            } else if (activeTypeFilter === 'add') {
                filtered = filtered.filter(log => log.type === 'add');
            }

            // 2. Filter by Date Range
            if (startDateFilter || endDateFilter) {
                filtered = filtered.filter(log => {
                    if (!log.date) return false;
                    const logDate = new Date(log.date);
                    
                    if (startDateFilter && endDateFilter) {
                        return logDate >= startDateFilter && logDate <= endDateFilter;
                    } else if (startDateFilter) {
                        return logDate >= startDateFilter;
                    } else if (endDateFilter) {
                        return logDate <= endDateFilter;
                    }
                    return true;
                });
            }

            return filtered;
        }

        function renderHistoryLogs() {
            const container = document.getElementById('history-list-container');
            const emptyState = document.getElementById('empty-state');

            const now = new Date();
            const todayStr = now.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });

            // Calculate Today's Deduction Summary
            let todayDeductedTotal = 0;
            history.forEach(log => {
                if (log.type === 'deduct' && log.date === todayStr) {
                    todayDeductedTotal += (parseInt(log.amount) || 0);
                }
            });

            document.getElementById('today-deducted-count').innerText = `${todayDeductedTotal.toLocaleString()} Units`;

            const filtered = getFilteredLogs();
            document.getElementById('total-logs-count').innerText = filtered.length.toLocaleString();

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // Render List (Latest first)
            container.innerHTML = [...filtered].reverse().map(log => {
                const isDeduct = log.type === 'deduct';
                const badgeColor = isDeduct ? 'bg-red-50 text-red-600 border-red-100' : 'bg-emerald-50 text-emerald-600 border-emerald-100';
                const icon = isDeduct ? 'fa-minus text-red-500' : 'fa-plus text-emerald-600';

                return `
                    <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm flex items-center justify-between gap-2.5 w-full">
                        <div class="flex items-center gap-2.5 overflow-hidden flex-1 min-w-0">
                            <div class="w-9 h-9 rounded-xl ${badgeColor} flex items-center justify-center font-extrabold text-xs border flex-shrink-0">
                                <i class="fa-solid ${icon}"></i>
                            </div>
                            <div class="overflow-hidden min-w-0 flex-1">
                                <h4 class="font-bold text-gray-800 text-xs truncate leading-tight">${log.itemName || 'Stock Item'}</h4>
                                <p class="text-[10px] text-gray-400 truncate mt-0.5">${log.reason || 'Stock Action'} • ${log.time || ''}</p>
                                <span class="inline-block text-[9px] text-purple-600 font-bold mt-0.5">${log.date || ''}</span>
                            </div>
                        </div>

                        <div class="text-right flex-shrink-0">
                            <span class="text-xs font-extrabold ${isDeduct ? 'text-red-500' : 'text-emerald-600'}">
                                ${isDeduct ? '-' : '+'}${log.amount} Units
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Professional Clean Printable/Downloadable Report Window Generator
        function exportCleanReport() {
            const filtered = getFilteredLogs();

            if (filtered.length === 0) {
                showToast("No history logs to export!");
                return;
            }

            const now = new Date();
            const printDate = now.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });

            let tableRows = filtered.reverse().map((log, index) => `
                <tr style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 10px; font-size: 12px; color: #475569;">${index + 1}</td>
                    <td style="padding: 10px; font-size: 12px; color: #1e293b; font-weight: bold;">${log.date || ''} (${log.time || ''})</td>
                    <td style="padding: 10px; font-size: 12px; color: #0f172a; font-weight: bold;">${log.itemName || ''}</td>
                    <td style="padding: 10px; font-size: 12px; font-weight: bold; color: ${log.type === 'deduct' ? '#dc2626' : '#16a34a'};">
                        ${log.type === 'deduct' ? 'Deducted (-)' : 'Restocked (+)'}
                    </td>
                    <td style="padding: 10px; font-size: 12px; font-weight: bold; text-align: right; color: #0f172a;">${log.amount} Units</td>
                </tr>
            `).join('');

            const reportHTML = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Stock Usage Report - Ice Cream & Slush POS</title>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #fff; color: #1e293b; }
                        .header { text-align: center; border-bottom: 2px solid #a855f7; padding-bottom: 15px; margin-bottom: 20px; }
                        .header h1 { margin: 0; font-size: 22px; color: #7e22ce; }
                        .header p { margin: 5px 0 0 0; font-size: 12px; color: #64748b; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                        th { background-color: #f8fafc; color: #475569; font-size: 11px; text-transform: uppercase; text-align: left; padding: 10px; border-bottom: 2px solid #e2e8f0; }
                        .footer { margin-top: 30px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 10px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>ICE CREAM & SLUSH STOCK REPORT</h1>
                        <p>Generated on: ${printDate} | Total Logs: ${filtered.length}</p>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Date & Time</th>
                                <th>Item Name</th>
                                <th>Action Type</th>
                                <th style="text-align: right;">Quantity</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    <div class="footer">
                        Ice Cream & Slush POS System • Offline Local Storage Report
                    </div>
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
                </html>
            `;

            const reportWindow = window.open('', '_blank');
            reportWindow.document.write(reportHTML);
            reportWindow.document.close();
        }

        function clearHistoryLogs() {
            if (history.length === 0) {
                showToast("History is already empty!");
                return;
            }

            if (confirm("Are you sure you want to clear all history records? Stock values will remain unchanged.")) {
                history = [];
                localStorage.setItem('ic_history', JSON.stringify([]));
                renderHistoryLogs();
                showToast("History logs cleared successfully!");
            }
        }
    </script>
</body>
</html>
