<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ice Cream Stock Pro - Dashboard</title>
    
    <!-- Theme Color for Mobile Browser -->
    <meta name="theme-color" content="#a855f7">
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS Console Warning Suppressor -->
    <script>
        const originalWarn = console.warn;
        console.warn = function(msg) {
            if (typeof msg === 'string' && msg.includes('cdn.tailwindcss.com should not be used in production')) return;
            originalWarn.apply(console, arguments);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            purple: '#f3e8ff', pink: '#fce7f3', 
                            blue: '#e0f2fe', dark: '#1f2937'
                        }
                    },
                    boxShadow: {
                        'ios': '0 8px 30px rgba(0,0,0,0.04)',
                        'ios-lg': '0 20px 40px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            overflow-x: hidden;
            user-select: none; /* App feel */
        }
        
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Entry Animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <!-- ========================================== -->
    <!-- TOP APP BAR                                -->
    <!-- ========================================== -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm py-4 px-5 flex justify-between items-center border-b border-gray-100">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-ice-cream text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-800 leading-tight">Dashboard</h1>
                <p class="text-[10px] text-gray-500 font-medium uppercase tracking-wider">Local Admin</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button id="install-btn" class="hidden bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-xs font-bold border border-purple-200 active:scale-95 transition">
                <i class="fa-solid fa-download mr-1"></i> Install
            </button>
            <button onclick="window.location.href='add.html'" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-100 hover:text-purple-600 transition active:scale-90">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT AREA                          -->
    <!-- ========================================== -->
    <main class="flex-1 w-full max-w-lg mx-auto overflow-y-auto px-4 pt-6 pb-24 animate-fade-up">
        
        <!-- Stats Card -->
        <div class="bg-gradient-to-br from-gray-900 to-gray-800 rounded-3xl p-6 text-white shadow-ios-lg mb-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-purple-500 opacity-20 rounded-full blur-2xl -mr-10 -mt-10"></div>
            <h3 class="text-sm font-medium text-gray-300 mb-1">Total Inventory Value</h3>
            <h2 class="text-4xl font-extrabold mb-6" id="total-value-display">Rs 0</h2>
            
            <div class="flex justify-between items-center border-t border-gray-700 pt-4">
                <div>
                    <p class="text-xs text-gray-400">Total Items</p>
                    <p class="text-lg font-bold" id="total-items-display">0</p>
                </div>
                <div class="w-px h-8 bg-gray-700"></div>
                <div>
                    <p class="text-xs text-gray-400">Categories</p>
                    <p class="text-lg font-bold" id="total-categories-display">0</p>
                </div>
                <div class="w-px h-8 bg-gray-700"></div>
                <div>
                    <p class="text-xs text-gray-400">Low Stock</p>
                    <p class="text-lg font-bold text-red-400" id="low-stock-display">0</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="flex justify-between items-end mb-4">
            <h3 class="text-lg font-bold text-gray-800">Quick Actions</h3>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-8">
            <button onclick="window.location.href='add.html?type=category'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3 active:scale-95 transition">
                <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-folder-plus"></i>
                </div>
                <div class="text-left">
                    <p class="text-sm font-bold text-gray-800 leading-tight">Add Category</p>
                </div>
            </button>
            <button onclick="window.location.href='add.html?type=item'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3 active:scale-95 transition">
                <div class="w-10 h-10 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <div class="text-left">
                    <p class="text-sm font-bold text-gray-800 leading-tight">Add Stock</p>
                </div>
            </button>
        </div>

        <!-- Recent Categories -->
        <div class="flex justify-between items-end mb-4">
            <h3 class="text-lg font-bold text-gray-800">Recent Categories</h3>
            <button onclick="window.location.href='view.html'" class="text-sm font-semibold text-purple-600 hover:underline">View All</button>
        </div>
        <div id="home-categories-list" class="space-y-3">
            <!-- Categories injected here by JavaScript -->
        </div>

    </main>

    <!-- ========================================== -->
    <!-- BOTTOM NAVIGATION BAR                      -->
    <!-- ========================================== -->
    <nav class="fixed bottom-0 left-0 w-full glass-nav z-50 pb-safe pb-2">
        <div class="flex justify-around items-center h-16 px-2 max-w-lg mx-auto">
            <!-- Active State (Home) -->
            <button onclick="window.location.href='index.html'" class="flex flex-col items-center w-full text-purple-600 transition active:scale-90">
                <i class="fa-solid fa-house text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <!-- Inactive States -->
            <button onclick="window.location.href='view.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-layer-group text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">View</span>
            </button>
            <!-- Floating Add Button -->
            <button onclick="window.location.href='add.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90 relative">
                <div class="absolute -top-6 w-12 h-12 bg-gray-900 text-white rounded-full flex items-center justify-center shadow-lg border-4 border-white transition-transform hover:scale-105">
                    <i class="fa-solid fa-plus text-xl"></i>
                </div>
                <span class="text-[10px] font-semibold mt-7">Add</span>
            </button>
            <button onclick="window.location.href='setting.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-gear text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Setting</span>
            </button>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC                           -->
    <!-- ========================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Fetch Data from Local Storage safely
            let categories = [];
            let items = [];
            
            try {
                categories = JSON.parse(localStorage.getItem('ic_categories')) || [];
                items = JSON.parse(localStorage.getItem('ic_items')) || [];
            } catch (e) {
                console.error("Error reading from local storage:", e);
                // Reset if data is corrupted
                localStorage.setItem('ic_categories', JSON.stringify([]));
                localStorage.setItem('ic_items', JSON.stringify([]));
            }

            // 2. Calculate and Display Stats
            const totalItems = items.reduce((sum, item) => sum + (parseInt(item.quantity) || 0), 0);
            const totalValue = items.reduce((sum, item) => sum + ((parseInt(item.quantity) || 0) * (parseFloat(item.price) || 0)), 0);
            const lowStock = items.filter(item => (parseInt(item.quantity) || 0) < 50).length;

            document.getElementById('total-items-display').innerText = totalItems.toLocaleString();
            document.getElementById('total-categories-display').innerText = categories.length.toLocaleString();
            document.getElementById('total-value-display').innerText = 'Rs ' + totalValue.toLocaleString();
            document.getElementById('low-stock-display').innerText = lowStock.toLocaleString();

            // 3. Render Recent Categories (Last 3 added)
            const catListContainer = document.getElementById('home-categories-list');
            
            if(categories.length === 0) {
                catListContainer.innerHTML = `
                    <div class="p-6 text-center bg-white rounded-2xl border border-gray-100 shadow-sm flex flex-col items-center justify-center">
                        <i class="fa-regular fa-folder-open text-4xl text-gray-300 mb-2"></i>
                        <h4 class="text-gray-700 font-bold">No Categories Yet</h4>
                        <p class="text-xs text-gray-500 mt-1">Tap 'Add Category' to get started.</p>
                    </div>`;
            } else {
                // Get the last 3 categories and reverse them to show newest first
                const recentCategories = [...categories].slice(-3).reverse();
                
                catListContainer.innerHTML = recentCategories.map(cat => {
                    // Count total items inside this specific category
                    const catItems = items.filter(i => i.categoryId === cat.id);
                    const itemCount = catItems.reduce((sum, i) => sum + (parseInt(i.quantity) || 0), 0);
                    
                    return `
                    <div class="flex items-center gap-4 bg-white p-3 rounded-2xl shadow-sm border border-gray-100 transition hover:shadow-md">
                        <img src="${cat.image || 'https://via.placeholder.com/150?text=No+Image'}" alt="${cat.name}" class="w-14 h-14 rounded-xl object-cover border border-gray-50">
                        <div class="flex-1 overflow-hidden">
                            <h4 class="font-bold text-gray-800 truncate">${cat.name}</h4>
                            <p class="text-xs text-gray-500">${catItems.length} Products Types</p>
                        </div>
                        <div class="text-right pl-2">
                            <p class="text-[10px] text-gray-400 uppercase tracking-wide">Stock</p>
                            <p class="font-bold text-purple-600">${itemCount}</p>
                        </div>
                    </div>`;
                }).join('');
            }

            // 4. PWA Installation Setup
            let deferredPrompt;
            const installBtn = document.getElementById('install-btn');
            
            // Create a dynamic manifest for PWA installation
            const manifest = {
                "name": "Ice Cream Stock Pro",
                "short_name": "Stock Pro",
                "start_url": "splash.html",
                "display": "standalone",
                "background_color": "#f8fafc",
                "theme_color": "#a855f7",
                "icons": [{
                    "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cGF0aCBmaWxsPSIjYTg1NWY3IiBkPSJNMjg4IDE0NGMyNi41IDAgNDgtMjEuNSA0OC00OHMtMjEuNS00OC00OC00OC00OCAyMS41LTQ4IDQ4IDIxLjUgNDggNDggNDh6bTE5MS41IDEyOEM0NDUuOSAyNzIuOSAzOTkuNSAyNzIgMzUyIDI3MmMtMTcuNyAwLTMyLTE0LjMtMzItMzJzMTQuMy0zMiAzMi0zMmM1OC4xIDAgMTE1LjEtNC40IDE3MC4zLTEyLjggMTUuNi0yLjQgMzAuMSA4LjIgMzIuNSAyMy45czguMiAzMC4xLTIzLjkgMzIuNS02LjEgLjktNi44LjR6Ii8+PC9zdmc+",
                    "sizes": "192x192",
                    "type": "image/svg+xml"
                }]
            };
            
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestURL}">`);

            // Listen for the install prompt event
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.classList.remove('hidden');
            });

            // Handle install button click
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        installBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                }
            });
        });
    </script>
</body>
</html>
