<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ice Cream Stock Pro - Add Inventory</title>
    
    <!-- Theme Color for Mobile Browser -->
    <meta name="theme-color" content="#a855f7">
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS Console Warning Suppressor -->
    <script>
        const originalWarn = console.warn;
        console.warn = function(msg) {
            if (typeof msg === 'string' && msg.includes('cdn.tailwindcss.com should not be used in production')) return;
            originalWarn.apply(console, arguments);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            purple: '#f3e8ff', pink: '#fce7f3', 
                            blue: '#e0f2fe', dark: '#1f2937'
                        }
                    },
                    boxShadow: {
                        'ios': '0 8px 30px rgba(0,0,0,0.04)',
                        'ios-lg': '0 20px 40px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            overflow-x: hidden;
            user-select: none;
        }
        
        ::-webkit-scrollbar { display: none; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.4s ease-out forwards;
        }

        input[type="file"] { display: none; }
        .file-upload-box {
            border: 2px dashed #d8b4fe;
            background: #fdf4ff;
            transition: all 0.3s;
        }
        .file-upload-box:active { background: #fae8ff; transform: scale(0.98); }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <!-- ========================================== -->
    <!-- TOP APP BAR                                -->
    <!-- ========================================== -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm py-4 px-5 flex justify-between items-center border-b border-gray-100">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-100 hover:text-purple-600 transition active:scale-90">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div>
                <h1 class="text-lg font-bold text-gray-800 leading-tight">Add Inventory</h1>
                <p class="text-[10px] text-gray-500 font-medium uppercase tracking-wider">New Entry</p>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT AREA                          -->
    <!-- ========================================== -->
    <main class="flex-1 w-full max-w-lg mx-auto overflow-y-auto px-4 pt-5 pb-24 animate-fade-up">
        
        <!-- Toggle Tabs for Form Type -->
        <div class="flex bg-gray-100 p-1.5 rounded-2xl mb-6 shadow-inner">
            <button onclick="switchForm('category')" id="tab-category" class="flex-1 py-3 rounded-xl font-bold text-sm transition shadow-sm bg-white text-purple-700">Add Category</button>
            <button onclick="switchForm('item')" id="tab-item" class="flex-1 py-3 rounded-xl font-bold text-sm transition text-gray-500">Add Stock Item</button>
        </div>

        <!-- FORM 1: CATEGORY FORM -->
        <div id="form-category" class="space-y-5">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-4">
                <h3 class="font-bold text-gray-800 border-b border-gray-50 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-purple-500"></i> Category Information
                </h3>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Category Name</label>
                    <input type="text" id="cat-name" placeholder="e.g. Ice Cream Cups, Spoons" class="w-full bg-gray-50 border border-gray-200 p-3.5 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Category Image</label>
                    <label class="file-upload-box w-full h-32 flex flex-col items-center justify-center rounded-2xl cursor-pointer">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-purple-400 mb-2"></i>
                        <span class="text-xs font-semibold text-purple-700" id="cat-img-text">Tap to select image</span>
                        <input type="file" id="cat-img" accept="image/*" onchange="handleImageUpload(event, 'cat-img-preview', 'cat-img-text', 'cat')">
                    </label>
                    <img id="cat-img-preview" class="hidden mt-3 w-full h-32 object-cover rounded-2xl border border-gray-200 shadow-sm">
                </div>

                <button onclick="saveCategory()" class="w-full bg-purple-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-purple-700 active:scale-95 transition mt-2">
                    Save Category
                </button>
            </div>
        </div>

        <!-- FORM 2: STOCK ITEM FORM -->
        <div id="form-item" class="space-y-5 hidden">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-4">
                <h3 class="font-bold text-gray-800 border-b border-gray-50 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-box-open text-pink-500"></i> Stock Product Details
                </h3>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Select Category</label>
                    <select id="item-cat" class="w-full bg-gray-50 border border-gray-200 p-3.5 rounded-2xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-purple-400">
                        <!-- Options injected dynamically -->
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Item Name</label>
                    <input type="text" id="item-name" placeholder="e.g. 100ml Plastic Cup" class="w-full bg-gray-50 border border-gray-200 p-3.5 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Quantity</label>
                        <input type="number" id="item-qty" placeholder="0" class="w-full bg-gray-50 border border-gray-200 p-3.5 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Price (Rs)</label>
                        <input type="number" id="item-price" placeholder="0.00" class="w-full bg-gray-50 border border-gray-200 p-3.5 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Description</label>
                    <textarea id="item-desc" rows="2" placeholder="Item details, quality, notes..." class="w-full bg-gray-50 border border-gray-200 p-3.5 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Product Image</label>
                    <label class="file-upload-box w-full h-24 flex flex-col items-center justify-center rounded-2xl cursor-pointer">
                        <i class="fa-solid fa-camera text-xl text-pink-400 mb-1"></i>
                        <span class="text-[10px] font-semibold text-pink-700" id="item-img-text">Tap to select image</span>
                        <input type="file" id="item-img" accept="image/*" onchange="handleImageUpload(event, 'item-img-preview', 'item-img-text', 'item')">
                    </label>
                    <img id="item-img-preview" class="hidden mt-2 w-full h-24 object-cover rounded-xl border border-gray-200 shadow-sm">
                </div>

                <button onclick="saveItem()" class="w-full bg-pink-500 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-pink-600 active:scale-95 transition mt-2">
                    Save Stock Item
                </button>
            </div>
        </div>

    </main>

    <!-- Custom Toast Notification -->
    <div id="toast-box" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full text-sm font-medium shadow-xl z-[100] transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        Message here
    </div>

    <!-- ========================================== -->
    <!-- BOTTOM NAVIGATION BAR                      -->
    <!-- ========================================== -->
    <nav class="fixed bottom-0 left-0 w-full glass-nav z-50 pb-safe pb-2">
        <div class="flex justify-around items-center h-16 px-2 max-w-lg mx-auto">
            <button onclick="window.location.href='index.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-house text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Home</span>
            </button>
            <button onclick="window.location.href='view.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-layer-group text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">View</span>
            </button>
            <button onclick="window.location.href='add.html'" class="flex flex-col items-center w-full text-purple-600 transition active:scale-90 relative">
                <div class="absolute -top-6 w-12 h-12 bg-gray-900 text-white rounded-full flex items-center justify-center shadow-lg border-4 border-white transition-transform hover:scale-105">
                    <i class="fa-solid fa-plus text-xl"></i>
                </div>
                <span class="text-[10px] font-bold mt-7">Add</span>
            </button>
            <button onclick="window.location.href='setting.html'" class="flex flex-col items-center w-full text-gray-400 hover:text-gray-800 transition active:scale-90">
                <i class="fa-solid fa-gear text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Setting</span>
            </button>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC                           -->
    <!-- ========================================== -->
    <script>
        let categories = [];
        let items = [];
        let catImageBase64 = '';
        let itemImageBase64 = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            populateCategoryDropdown();

            // Check URL parameters to auto-switch tab if requested (e.g., add.html?type=item)
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            if(type === 'item') {
                switchForm('item');
            }
        });

        function loadData() {
            try {
                categories = JSON.parse(localStorage.getItem('ic_categories')) || [];
                items = JSON.parse(localStorage.getItem('ic_items')) || [];
            } catch (e) {
                categories = [];
                items = [];
            }
        }

        function switchForm(formType) {
            const btnCat = document.getElementById('tab-category');
            const btnItem = document.getElementById('tab-item');
            const formCat = document.getElementById('form-category');
            const formItem = document.getElementById('form-item');

            if(formType === 'category') {
                btnCat.className = "flex-1 py-3 rounded-xl font-bold text-sm transition shadow-sm bg-white text-purple-700";
                btnItem.className = "flex-1 py-3 rounded-xl font-bold text-sm transition text-gray-500";
                formCat.classList.remove('hidden');
                formItem.classList.add('hidden');
            } else {
                btnItem.className = "flex-1 py-3 rounded-xl font-bold text-sm transition shadow-sm bg-white text-pink-600";
                btnCat.className = "flex-1 py-3 rounded-xl font-bold text-sm transition text-gray-500";
                formItem.classList.remove('hidden');
                formCat.classList.add('hidden');
                populateCategoryDropdown();
            }
        }

        function populateCategoryDropdown() {
            const select = document.getElementById('item-cat');
            if(categories.length === 0) {
                select.innerHTML = '<option value="">No categories found! Please add one first.</option>';
            } else {
                select.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            }
        }

        // Image compression and base64 conversion
        function handleImageUpload(event, previewId, textId, target) {
            const file = event.target.files[0];
            if(!file) return;

            document.getElementById(textId).innerText = "Processing...";
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; // Compress width for storage limits
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const compressedData = canvas.toDataURL('image/jpeg', 0.7);
                    
                    if(target === 'cat') catImageBase64 = compressedData;
                    if(target === 'item') itemImageBase64 = compressedData;

                    const preview = document.getElementById(previewId);
                    preview.src = compressedData;
                    preview.classList.remove('hidden');
                    document.getElementById(textId).innerText = "Image Selected";
                }
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-box');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3000);
        }

        function saveCategory() {
            const name = document.getElementById('cat-name').value.trim();
            if(!name) return showToast('Please enter category name!');
            if(!catImageBase64) return showToast('Please select a category image!');

            const newCategory = {
                id: Date.now().toString(),
                name: name,
                image: catImageBase64
            };

            categories.push(newCategory);
            localStorage.setItem('ic_categories', JSON.stringify(categories));
            
            showToast('Category Saved Successfully!');
            setTimeout(() => {
                window.location.href = 'view.html';
            }, 1000);
        }

        function saveItem() {
            const catId = document.getElementById('item-cat').value;
            const name = document.getElementById('item-name').value.trim();
            const qty = parseInt(document.getElementById('item-qty').value) || 0;
            const price = parseFloat(document.getElementById('item-price').value) || 0;
            const desc = document.getElementById('item-desc').value.trim();

            if(!catId) return showToast('Please select a category first!');
            if(!name) return showToast('Please enter item name!');

            const newItem = {
                id: Date.now().toString(),
                categoryId: catId,
                name: name,
                quantity: qty,
                price: price,
                desc: desc,
                image: itemImageBase64 || 'https://via.placeholder.com/150?text=No+Image'
            };

            items.push(newItem);
            localStorage.setItem('ic_items', JSON.stringify(items));

            showToast('Stock Item Saved Successfully!');
            setTimeout(() => {
                window.location.href = 'view.html';
            }, 1000);
        }
    </script>
</body>
</html>
